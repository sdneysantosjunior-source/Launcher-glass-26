name: Compilar Launcher Glass 26 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Construir Launcher-glass-26.apk (Android 14 TV)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências do Web App
        run: npm install --legacy-peer-deps

      - name: Compilar Frontend Vite (dist)
        run: npm run build

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceitar Licenças do Android SDK (Android 14 - API 34)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Gerar Projeto Nativo Android 14 TV (Integrado com Apps e Watch Next)
        run: |
          mkdir -p android/app/src/main/java/com/sdneysantos/launcherglass
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets

          # Copiar o build do frontend (incluindo assets/launcher/*) para os assets do APK
          cp -r dist/* android/app/src/main/assets/

          # Configurar gradle.properties
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

          # Configurar settings.gradle
          cat << 'EOF' > android/settings.gradle
          rootProject.name = 'LauncherGlass26'
          include ':app'
          EOF

          # Configurar build.gradle raiz
          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Configurar app/build.gradle para Android 14 TV (API 34)
          cat << 'EOF' > android/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.sdneysantos.launcherglass'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sdneysantos.launcherglass"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "2.0.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              // 100% nativo do SDK Android 14 (Zero conflito de bibliotecas e ultra leve para 2GB RAM)
          }
          EOF

          # Criar AndroidManifest.xml com permissões de TV, Watch Next e Leanback Launcher
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="com.android.providers.tv.permission.READ_EPG_DATA" />
              <uses-permission android:name="com.android.providers.tv.permission.WRITE_EPG_DATA" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/ic_launcher"
                  android:label="Launcher Glass 26"
                  android:theme="@style/Theme.LauncherGlass"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:screenOrientation="landscape"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|smallestScreenSize">
                      
                      <!-- Home Principal da Android TV -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.action.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                      <!-- Ícone no menu de aplicativos e Leanback Android 14 TV -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Criar tema nativo Fullscreen
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.LauncherGlass" parent="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          # Criar ícone vetorial da Launcher
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#050711"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#38bdf8"
                  android:pathData="M22,22h64v64h-64z"/>
          </vector>
          EOF

          # Criar MainActivity.java com integração Watch Next + Apps Instalados + Deep Links + HDMI
          cat << 'EOF' > android/app/src/main/java/com/sdneysantos/launcherglass/MainActivity.java
          package com.sdneysantos.launcherglass;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.KeyEvent;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.InputStream;
          import java.util.List;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private WebView webView;

              public class AndroidTVBridge {
                  @JavascriptInterface
                  public boolean launchApp(String packageNamesCsv) {
                      return launchDeepLink(packageNamesCsv, "");
                  }

                  @JavascriptInterface
                  public boolean launchDeepLink(String packageNamesCsv, String deepLinkUri) {
                      if (packageNamesCsv == null || packageNamesCsv.isEmpty()) return false;
                      PackageManager pm = getPackageManager();
                      String[] packages = packageNamesCsv.split(",");
                      for (String rawPkg : packages) {
                          String pkg = rawPkg.trim();
                          if (pkg.isEmpty()) continue;
                          try {
                              // 1. Se tiver deepLinkUri e o pacote estiver instalado, abre o conteúdo direto no app da TV
                              if (deepLinkUri != null && !deepLinkUri.isEmpty()) {
                                  Intent leanbackCheck = pm.getLeanbackLaunchIntentForPackage(pkg);
                                  Intent normalCheck = pm.getLaunchIntentForPackage(pkg);
                                  if (leanbackCheck != null || normalCheck != null) {
                                      try {
                                          Intent deepIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(deepLinkUri));
                                          deepIntent.setPackage(pkg);
                                          deepIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                          startActivity(deepIntent);
                                          return true;
                                      } catch (Exception ignored) {
                                      }
                                  }
                              }
                              // 2. Abre o app nativo Android TV (Leanback)
                              Intent leanbackIntent = pm.getLeanbackLaunchIntentForPackage(pkg);
                              if (leanbackIntent != null) {
                                  leanbackIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(leanbackIntent);
                                  return true;
                              }
                              // 3. Fallback para intent padrão do pacote
                              Intent normalIntent = pm.getLaunchIntentForPackage(pkg);
                              if (normalIntent != null) {
                                  normalIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(normalIntent);
                                  return true;
                              }
                          } catch (Exception ignored) {
                          }
                      }
                      return false;
                  }

                  @JavascriptInterface
                  public String getInstalledAppsJson() {
                      JSONArray arr = new JSONArray();
                      try {
                          PackageManager pm = getPackageManager();
                          List<ApplicationInfo> apps = pm.getInstalledApplications(PackageManager.GET_META_DATA);
                          for (ApplicationInfo app : apps) {
                              String pkg = app.packageName;
                              if (pkg.equals(getPackageName())) continue;
                              if (pkg.startsWith("com.android.cts") || pkg.startsWith("com.android.providers")) continue;
                              Intent leanback = pm.getLeanbackLaunchIntentForPackage(pkg);
                              Intent regular = pm.getLaunchIntentForPackage(pkg);
                              boolean isSystem = (app.flags & ApplicationInfo.FLAG_SYSTEM) != 0;
                              boolean isUpdatedSystem = (app.flags & ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) != 0;
                              boolean isThirdParty = !isSystem || isUpdatedSystem;
                              if (leanback != null || regular != null) {
                                  JSONObject obj = new JSONObject();
                                  obj.put("packageName", pkg);
                                  obj.put("label", pm.getApplicationLabel(app).toString());
                                  obj.put("isTvApp", leanback != null);
                                  obj.put("isThirdParty", isThirdParty);
                                  arr.put(obj);
                              }
                          }
                      } catch (Exception ignored) {
                      }
                      return arr.toString();
                  }

                  private void queryTvProgramsUri(Uri uri, JSONArray arr, PackageManager pm) {
                      Cursor cursor = null;
                      try {
                          cursor = getContentResolver().query(uri, null, null, null, null);
                          if (cursor != null) {
                              int titleIdx = cursor.getColumnIndex("title");
                              int descIdx = cursor.getColumnIndex("short_description");
                              int epTitleIdx = cursor.getColumnIndex("episode_title");
                              int pkgIdx = cursor.getColumnIndex("package_name");
                              int posterIdx = cursor.getColumnIndex("poster_art_uri");
                              int thumbIdx = cursor.getColumnIndex("thumbnail_uri");
                              int intentIdx = cursor.getColumnIndex("intent_uri");
                              int posIdx = cursor.getColumnIndex("last_playback_position_millis");
                              int durIdx = cursor.getColumnIndex("duration_millis");
                              int browsableIdx = cursor.getColumnIndex("browsable");

                              while (cursor.moveToNext() && arr.length() < 12) {
                                  if (browsableIdx >= 0 && cursor.getInt(browsableIdx) == 0) {
                                      continue;
                                  }
                                  String pkg = pkgIdx >= 0 ? cursor.getString(pkgIdx) : "";
                                  if (pkg == null || pkg.isEmpty()) continue;
                                  // Filtrar pacotes do sistema para manter apenas apps de terceiros
                                  if (pkg.equals(getPackageName()) || pkg.startsWith("com.android.tv.settings") || pkg.startsWith("com.google.android.tvlauncher")) {
                                      continue;
                                  }
                                  String title = titleIdx >= 0 ? cursor.getString(titleIdx) : "";
                                  if (title == null || title.trim().isEmpty()) continue;

                                  boolean duplicate = false;
                                  for (int i = 0; i < arr.length(); i++) {
                                      JSONObject existing = arr.optJSONObject(i);
                                      if (existing != null && title.equalsIgnoreCase(existing.optString("title")) && pkg.equals(existing.optString("packageName"))) {
                                          duplicate = true;
                                          break;
                                      }
                                  }
                                  if (duplicate) continue;

                                  String providerName = pkg;
                                  try {
                                      ApplicationInfo ai = pm.getApplicationInfo(pkg, 0);
                                      CharSequence label = pm.getApplicationLabel(ai);
                                      if (label != null && label.length() > 0) {
                                          providerName = label.toString();
                                      }
                                  } catch (Exception ignored) {
                                  }

                                  JSONObject obj = new JSONObject();
                                  obj.put("title", title);
                                  String sub = "";
                                  if (epTitleIdx >= 0 && cursor.getString(epTitleIdx) != null) {
                                      sub = cursor.getString(epTitleIdx);
                                  } else if (descIdx >= 0 && cursor.getString(descIdx) != null) {
                                      sub = cursor.getString(descIdx);
                                  } else {
                                      sub = "Continuar no " + providerName;
                                  }
                                  obj.put("subtitle", sub);
                                  obj.put("provider", providerName);
                                  obj.put("packageName", pkg);

                                  String art = "";
                                  if (thumbIdx >= 0 && cursor.getString(thumbIdx) != null && !cursor.getString(thumbIdx).isEmpty()) {
                                      art = cursor.getString(thumbIdx);
                                  } else if (posterIdx >= 0 && cursor.getString(posterIdx) != null) {
                                      art = cursor.getString(posterIdx);
                                  }
                                  obj.put("posterUri", art);
                                  if (intentIdx >= 0 && cursor.getString(intentIdx) != null) {
                                      obj.put("intentUri", cursor.getString(intentIdx));
                                  }
                                  int progress = 35;
                                  if (posIdx >= 0 && durIdx >= 0) {
                                      long pos = cursor.getLong(posIdx);
                                      long dur = cursor.getLong(durIdx);
                                      if (dur > 0 && pos > 0) {
                                          progress = Math.min(95, Math.max(5, (int) ((pos * 100) / dur)));
                                      }
                                  }
                                  obj.put("progress", progress);
                                  arr.put(obj);
                              }
                          }
                      } catch (Exception ignored) {
                      } finally {
                          if (cursor != null) cursor.close();
                      }
                  }

                  @JavascriptInterface
                  public String getWatchNextProgramsJson() {
                      JSONArray arr = new JSONArray();
                      try {
                          PackageManager pm = getPackageManager();
                          queryTvProgramsUri(Uri.parse("content://android.media.tv/watch_next_program"), arr, pm);
                          if (arr.length() < 5) {
                              queryTvProgramsUri(Uri.parse("content://android.media.tv/preview_program"), arr, pm);
                          }
                      } catch (Exception ignored) {
                      }
                      return arr.toString();
                  }

                  @JavascriptInterface
                  public boolean switchHdmiInput(int hdmiPort) {
                      try {
                          Intent intent = new Intent("android.media.tv.action.SETUP_INPUTS");
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean openPlayStore(String packageName) {
                      try {
                          Intent marketIntent = new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + packageName));
                          marketIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(marketIntent);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void openSettings() {
                      try {
                          Intent intent = new Intent(Settings.ACTION_SETTINGS);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      } catch (Exception ignored) {
                      }
                  }

                  @JavascriptInterface
                  public void openWifiSettings() {
                      try {
                          Intent intent = new Intent(Settings.ACTION_WIFI_SETTINGS);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      } catch (Exception ignored) {
                      }
                  }
              }

              @Override
              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#04060e"));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadsImagesAutomatically(true);

                  webView.addJavascriptInterface(new AndroidTVBridge(), "AndroidTV");

                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.requestFocus();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri url = request.getUrl();
                          if (url != null && "launcherglass.local".equals(url.getHost())) {
                              String path = url.getPath();
                              if (path == null || path.isEmpty() || "/".equals(path)) {
                                  path = "index.html";
                              } else if (path.startsWith("/")) {
                                  path = path.substring(1);
                              }
                              try {
                                  InputStream is = getAssets().open(path);
                                  String mime = "text/html";
                                  if (path.endsWith(".js")) mime = "application/javascript";
                                  else if (path.endsWith(".css")) mime = "text/css";
                                  else if (path.endsWith(".svg")) mime = "image/svg+xml";
                                  else if (path.endsWith(".png")) mime = "image/png";
                                  else if (path.endsWith(".jpg") || path.endsWith(".jpeg")) mime = "image/jpeg";
                                  else if (path.endsWith(".webp")) mime = "image/webp";
                                  else if (path.endsWith(".json")) mime = "application/json";
                                  else if (path.endsWith(".woff2")) mime = "font/woff2";
                                  return new WebResourceResponse(mime, "UTF-8", is);
                              } catch (Exception e) {
                                  return super.shouldInterceptRequest(view, request);
                              }
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri url = request.getUrl();
                          if (url != null && "launcherglass.local".equals(url.getHost())) {
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("https://launcherglass.local/index.html?tv=1");
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      webView.evaluateJavascript("window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', keyCode: 27 }));", null);
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Compilar APK Android 14 TV (Debug Assinado)
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar Arquivo APK Final
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Launcher-glass-26.apk
          echo "APK gerado com sucesso em output/Launcher-glass-26.apk"
          ls -lh output/Launcher-glass-26.apk

      - name: Salvar APK como Artefato do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-glass-26-apk
          path: output/Launcher-glass-26.apk
          if-no-files-found: error

      - name: Criar Release no GitHub com Link Direto
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "Launcher Glass 26 - v2.0.0 (Android 14 TV)"
          body: "APK assinado da Launcher Glass 26 (Visual Liquid Glass idêntico ao anexo + Integração Watch Next e Apps instalados no Android 14 TV)."
          files: output/Launcher-glass-26.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
